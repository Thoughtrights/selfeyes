[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfeyes-pipeline"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "Pillow>=10.0",
    "mediapipe>=0.10",
    "opencv-python-headless>=4.8",
    "typer>=0.12",
    "flask>=3.0",
    "tomli>=2.0; python_version < '3.12'",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "imagehash>=4.3",
]

[project.scripts]
selfeyes-pipeline = "selfeyes_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["selfeyes_pipeline*"]
