# selfeyes-pipeline configuration
# API keys go in .env (never committed), not here.

[flickr]
search_terms = [
  # Close-up faces — most likely to yield large eye regions
  "face closeup portrait",
  "eyes closeup portrait",
  "eye macro portrait",
  "portrait closeup eyes",
  "face close up photograph",
  # Reflective surfaces — directly relevant to the project
  "sunglasses reflection portrait",
  "aviators reflection portrait",
  "sunglasses closeup face",
  "eyeglasses reflection",
  "eye reflection portrait",
  "cornea reflection",
  # Selfies / mirrors
  "selfie portrait closeup",
  "mirror selfie face",
  # Original broader terms (kept, now with more pages)
  "self portrait",
  "sunglasses portrait",
  "aviators portrait",
  # Pets / animals — close-up only
  "cat eyes closeup",
  "dog eyes closeup",
  "horse eye closeup macro",
]
include_commons = true
per_page = 500
max_pages_per_term = 10

[loc]
# No API key required. All results are U.S. Government Work (public domain).
search_terms = [
  "portrait face closeup photograph",
  "daguerreotype portrait face",
  "photograph eyes face",
  "portrait close",
]
max_pages_per_term = 5
results_per_page = 50

[smithsonian]
# api_key via SMITHSONIAN_API_KEY env var
# unit_codes targets specific museums: NPG=National Portrait Gallery,
# NMAAHC=African American History & Culture, NMAH=American History
search_terms = [
  "unit_code:NPG portrait photograph",
  "unit_code:NPG daguerreotype",
  "unit_code:NPG tintype",
  "unit_code:NMAAHC portrait photograph",
  "unit_code:NMAAHC daguerreotype",
]
rows_per_request = 100
max_requests_per_term = 5

[licenses]
flickr_allowed = [4, 5, 7, 8, 9, 10]
# Set true only if gallery has a commercial dimension (prints, ad revenue, etc.)
allow_non_commercial = false

[filters]
min_long_side_px = 2400
min_eye_px = 200
sharpness_min_variance = 100.0
tag_blocklist = [
  # Minors
  "baby", "babies", "infant", "toddler",
  "child", "children", "kid", "kids",
  "school", "classroom",
  # AI-generated
  "ai", "aigenerated", "aiart", "aiportrait",
  "stablediffusion", "midjourney", "dalle", "dalle2", "dalle3",
  "generativeai", "artificialintelligence", "aiimage",
  "imagineai", "firefly", "leonardoai", "runwayml",
  # Illustrations / non-photographic
  "illustration", "illustrated", "drawing", "sketch",
  "digitalart", "digitalpainting", "digitalillustration",
  "artwork", "vector", "vectorart", "cartoon", "anime",
  "painting", "watercolor", "oilpainting", "acrylic",
  "3drender", "3dart", "cgi", "render", "blender",
  "virtualportrait",
]

[crop]
face_longest_side_px = 1400
face_padding_pct = 0.15
eye_padding_pct = 0.40
jpeg_quality_face = 88
jpeg_quality_eye = 92

[paths]
cache_dir = "data/cache"
db_path = "data/manifest.sqlite"
output_dir = "../html/assets/pipeline"
manifest_json = "../html/manifest.json"
